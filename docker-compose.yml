version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncsketch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: syncsketch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syncsketch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - syncsketch-net

  redis:
    image: redis:7-alpine
    container_name: syncsketch-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - syncsketch-net

  syncsketch-ws:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: syncsketch-ws
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      PORT: 1234
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/syncsketch?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1234/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - syncsketch-net

  syncsketch-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncsketch-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_WS_URL: "ws://localhost:1234"
    depends_on:
      syncsketch-ws:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - syncsketch-net

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  syncsketch-net:
    driver: bridge
